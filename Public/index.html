<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Iniciar sessão · Administração AutoMercado Angola</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

  <main class="login">

    <section class="login__brand" aria-label="AutoMercado Angola">
      <div>
        <img class="login__logo" src="assets/logo.png" alt="AutoMercado Angola" id="login-logo">
        <span class="wordmark" id="login-wordmark" hidden><span class="wordmark__main">AutoMercado</span><span class="wordmark__sub">ANGOLA</span></span>
      </div>
      <div>
        <h1 class="login__headline">Painel de administração</h1>
        <p class="login__copy">Gestão de anúncios, utilizadores e denúncias do marketplace AutoMercado Angola. Acesso reservado à equipa.</p>
      </div>
      <p class="login__foot">AutoMercado Angola</p>
    </section>

    <section class="login__panel">
      <div class="login__card">

        <div>
          <h2 class="login__title">Iniciar sessão</h2>
          <p class="login__sub">Usa a conta de administrador.</p>
        </div>

        <div id="login-message" class="notice notice--danger" role="alert" aria-live="assertive" hidden></div>

        <form id="login-form" class="login__form" novalidate>

          <div class="field">
            <label class="field__label" for="login-email">Email</label>
            <input class="input" id="login-email" name="email" type="email" inputmode="email"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required
                   aria-describedby="login-email-error">
            <p class="field__error" id="login-email-error" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="login-password">Password</label>
            <div class="input-wrap">
              <input class="input" id="login-password" name="password" type="password"
                     autocomplete="current-password" required aria-describedby="login-password-error">
              <button class="icon-btn input-wrap__btn" id="login-toggle" type="button"
                      aria-label="Mostrar password" aria-pressed="false">
                <span class="sr-only">Mostrar ou esconder a password</span>
              </button>
            </div>
            <p class="field__error" id="login-password-error" role="alert"></p>
          </div>

          <button class="btn btn--primary btn--block" id="login-submit" type="submit"><span>Entrar</span></button>

        </form>

        <p class="login__note">O acesso é registado. Sessões terminam sozinhas ao fim de 8 horas.</p>

      </div>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
